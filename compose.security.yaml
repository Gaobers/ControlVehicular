  services:
    db:
      image: mysql:8.4
      environment:
        MYSQL_DATABASE: ${SECURITY_DB_NAME:?Define SECURITY_DB_NAME en .env.security}
        MYSQL_USER: ${SECURITY_DB_USER:?Define SECURITY_DB_USER en .env.security}
        MYSQL_PASSWORD: ${SECURITY_DB_PASSWORD:?Define SECURITY_DB_PASSWORD en .env.security}
        MYSQL_ROOT_PASSWORD: ${SECURITY_DB_ROOT_PASSWORD:?Define SECURITY_DB_ROOT_PASSWORD en .env.security}
      volumes:
        - security_mysql_data:/var/lib/mysql
      networks:
        - security-net
      healthcheck:
        test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
        interval: 5s
        timeout: 5s
        retries: 20
        start_period: 20s

    api:
      build:
        context: .
        dockerfile: Dockerfile
      depends_on:
        db:
          condition: service_healthy
      environment:
        SERVER_PORT: "8080"
        SPRING_DATASOURCE_URL: "jdbc:mysql://db:3306/${SECURITY_DB_NAME}?sslMode=DISABLED&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8"
        SPRING_DATASOURCE_USERNAME: ${SECURITY_DB_USER}
        SPRING_DATASOURCE_PASSWORD: ${SECURITY_DB_PASSWORD}
        SPRING_JPA_HIBERNATE_DDL_AUTO: update
        SPRING_JPA_GENERATE_DDL: "true"
        SPRING_SQL_INIT_MODE: never
        JWT_SECRET: ${SECURITY_JWT_SECRET:?Define SECURITY_JWT_SECRET en .env.security}
      ports:
        - "127.0.0.1:8080:8080"
      networks:
        - security-net
      restart: unless-stopped

  networks:
    security-net:
      name: controlvehicular-security-net
      internal: true

  volumes:
    security_mysql_data:
      name: controlvehicular_security_mysql_data