spring.application.name=controlvehicular

# ============================================================
# MYSQL / AIVEN
# ============================================================

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=REQUIRED&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ============================================================
# JPA / HIBERNATE
# ============================================================

# Hibernate NO crea, modifica ni elimina tablas.
# Solo verifica que las entidades coincidan con la BD.
spring.jpa.hibernate.ddl-auto=validate

# Impide que JPA genere DDL automáticamente.
spring.jpa.generate-ddl=false

# No ejecutar automáticamente schema.sql ni data.sql.
spring.sql.init.mode=never

# No llenar la consola con cada consulta SQL.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Manejo de fechas consistente con la BD.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Evita mantener la sesión de Hibernate abierta
# durante toda la petición HTTP.
spring.jpa.open-in-view=false


# ============================================================
# JWT
# ============================================================

security.jwt.secret-key=${JWT_SECRET}


# ============================================================
# SERVIDOR LOCAL
# ============================================================

server.port=8080


# ============================================================
# MANEJO DE ERRORES
# ============================================================

# Mostrar el mensaje del error en la respuesta.
server.error.include-message=always

# No exponer stack trace al cliente.
server.error.include-stacktrace=never

# No exponer errores internos de binding innecesariamente.
server.error.include-binding-errors=never